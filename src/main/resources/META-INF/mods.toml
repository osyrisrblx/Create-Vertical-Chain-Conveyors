modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = ""

[[mods]]
    modId = "verticalchainconveyors"
    version = "${file.jarVersion}"
    displayName = "Vertical Chain Conveyors"
    description = '''
        Allows Create Chain Conveyors to mount on floors, ceilings, and walls,
        with axis-aware connection geometry, previews, rendering, and package movement.
    '''

[[dependencies.verticalchainconveyors]]
    modId = "forge"
    mandatory = true
    versionRange = "[47.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.verticalchainconveyors]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.21)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.verticalchainconveyors]]
    modId = "create"
    mandatory = true
    versionRange = "[6.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "verticalchainconveyors.mixins.json"
