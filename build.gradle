plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.107'
}

version = "${mod_version}"
group = "${mod_group}"
base { archivesName = "${mod_id}-${minecraft_version}" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    mixin {
        add(sourceSets.main, "${mod_id}.refmap.json")
        config("${mod_id}.mixins.json")
    }
}

repositories {
    maven {
        name 'sponge'
        url 'https://repo.spongepowered.org/repository/maven-public'
    }
    maven {
        name 'curse maven'
        url 'https://www.cursemaven.com'
    }
    maven {
        name 'modrinth'
        url 'https://api.modrinth.com/maven'
    }
}

dependencies {
    // Create 6.0.8 + its embedded dependencies (Ponder/Catnip) from the libs/ folder.
    // These JARs are extracted from create-1.20.1-6.0.8.jar for compilation.
    // At runtime the server already has Create installed.
    compileOnly fileTree(dir: 'libs', include: '*.jar')

    // SpongePowered Mixin API — needed at compile time for @Mixin, @Inject etc.
    compileOnly("org.spongepowered:mixin:0.8.5")
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"

    testImplementation fileTree(dir: 'libs', include: '*.jar')
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : "${mod_id}",
            'Specification-Vendor'  : 'osyris',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'osyris',
            'MixinConfigs'          : "${mod_id}.mixins.json"
        ])
    }
}
