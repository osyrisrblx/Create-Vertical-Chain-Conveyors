plugins {
    id 'net.neoforged.moddev' version '2.0.140'
}

version = "${mod_version}"
group = "${mod_group}"
base { archivesName = "${mod_id}-${minecraft_version}" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    enable {
        version = "${neoforge_version}"
        disableRecompilation = true
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name 'sponge'
        url 'https://repo.spongepowered.org/repository/maven-public'
    }
    maven {
        name 'curse maven'
        url 'https://www.cursemaven.com'
    }
    maven {
        name 'modrinth'
        url 'https://api.modrinth.com/maven'
    }
}

dependencies {
    // Create 6.0.10 + embedded deps (Flywheel/Ponder/Registrate) extracted from the jar.
    // compileOnly — at runtime these come from the Create mod jar on the client/server.
    compileOnly fileTree(dir: 'libs', include: '*.jar')

    compileOnly("org.spongepowered:mixin:0.8.5")
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"

    testImplementation fileTree(dir: 'libs', include: '*.jar')
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : "${mod_id}",
            'Specification-Vendor'  : 'osyris',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'osyris',
            'MixinConfigs'          : "${mod_id}.mixins.json"
        ])
    }
}
